# Routing. Reunites the two tiers under ONE hostname via path-prefix splitting,
# translated from the Compose Traefik labels (kiroku/kiroku-api).
#
# PUBLIC (K4 cutover complete, 2026-07-09): kiroku.neovara.uk only, via cloudflared
# -> Traefik's `web` entrypoint (TLS terminated at Cloudflare's edge, same as
# whoami/homepage). The internal-only kiroku.in.neovara.uk route and the legacy
# myanki.neovara.uk alias are retired — old-lab DNS is decommissioned, so nothing
# else depends on either name. See docs/migrations/kiroku.md.
#
# No metadata.namespace: the pointer Application injects kiroku at apply time.
---
# secure-headers — the k8s equivalent of the Compose `secure-headers@docker`
# middleware. A Traefik Middleware is a reusable request/response transform;
# routes opt in by referencing it. (errpages is deferred — needs an error-page
# backend service; add later.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true # don't let browsers MIME-sniff
    frameDeny: true # no embedding in iframes (clickjacking)
    stsSeconds: 31536000 # HSTS: force HTTPS for a year
    stsIncludeSubdomains: true
    stsPreload: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kiroku
spec:
  entryPoints:
    - web # plain HTTP inside the cluster — cloudflared holds the TLS-terminated edge
  routes:
    # /api/* → the Go backend. priority 100 so it out-ranks the catch-all below
    # for any request under /api (both rules match the host; highest priority wins).
    - match: Host(`kiroku.neovara.uk`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: kiroku-api # the Service from api.yaml → resolves to its pods' :8080
          port: 8080
      middlewares:
        - name: secure-headers
    # everything else → the Next.js frontend.
    - match: Host(`kiroku.neovara.uk`)
      kind: Rule
      services:
        - name: kiroku
          port: 3000
      middlewares:
        - name: secure-headers
